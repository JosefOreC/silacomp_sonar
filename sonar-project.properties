sonar.projectKey=convcomp
sonar.projectName=ConvComp
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=tests,frontend/e2e
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,frontend/src/assets/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=.reports/coverage.xml
sonar.python.xunit.reportPath=.reports/pytest.xml
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json


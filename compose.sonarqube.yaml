name: convcomp-quality

services:
  sonar-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Defina SONAR_DB_PASSWORD en .env}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Defina SONAR_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 40

  backend-tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/workspace

  sonar-scanner:
    profiles: ["tools"]
    image: ${SONAR_SCANNER_IMAGE:-sonarsource/sonar-scanner-cli:latest}
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    depends_on:
      sonarqube:
        condition: service_healthy
    volumes:
      - .:/usr/src:ro
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache
    command:
      - -Dsonar.working.directory=/tmp/sonar-work
      - -Dsonar.qualitygate.wait=true
      - -Dsonar.qualitygate.timeout=600

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_scanner_cache:


[project]
name = "conv-comp-backend"
version = "0.1.0"
description = "Motor de comparación y pre-evaluación computacional explicable de sílabos universitarios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pymupdf>=1.23.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.5.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"
